name: Notify Profile README

on:
  push:
    branches: [main, master]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger README update on newkub/newkub
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "PAT_TOKEN not set — skipping notification"
            exit 0
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/newkub/newkub/dispatches \
            -d '{"event_type":"push-update","client_payload":{"repo":"'"$GITHUB_REPOSITORY"'","sha":"'"$GITHUB_SHA"'"}}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY"
          if [ "$HTTP_CODE" = "204" ]; then
            echo "Dispatch sent successfully"
          else
            echo "Failed to send dispatch"
            exit 1
          fi
